    <style>
        /* --- 基础样式 --- */
        body {
            background-color: #1a1a1a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            user-select: none;
            min-height: 100vh;
        }

        h1 { margin-bottom: 10px; text-shadow: 0 0 10px #ff00de; color: #ff00de; font-style: italic; }

        /* --- 游戏机主体 --- */
        #game-cabinet {
            background: #2a2a2a;
            border: 10px solid #444;
            border-radius: 30px;
            padding: 20px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 440px; 
            position: relative;
        }

        /* --- 顶部状态栏 --- */
        .display-panel {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 5px;
            width: 100%;
            margin-bottom: 15px;
            background: #000;
            padding: 10px;
            border-radius: 12px;
            border: 2px solid #666;
            box-sizing: border-box;
        }
        .stat-box { text-align: center; }
        .stat-label { font-size: 11px; color: #aaa; margin-bottom: 2px; }
        .stat-value { font-size: 16px; font-weight: bold; font-family: 'Courier New', monospace; }
        .stat-value.highlight { color: #ffcc00; }
        .stat-value.points { color: #00ccff; }

        /* --- 画布与灯光 --- */
        canvas {
            background: radial-gradient(circle at 40% 30%, #2b2b48 0%, #000000 100%);
            border: 5px solid #5a3e2b;
            border-bottom: none;
            border-radius: 20px 20px 0 0;
            box-shadow: inset 0 0 30px #000;
            cursor: pointer;
            display: block;
            width: 400px; 
            height: 500px;
        }

        .lights-panel {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 10px;
            padding: 5px;
            background: #111;
            border-radius: 4px;
            box-sizing: border-box;
        }
        
        .lamp {
            width: 30px; height: 30px;
            border-radius: 50%;
            background: #333;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: bold; color: #555;
            box-shadow: inset 0 0 5px #000;
            transition: all 0.1s;
        }
        .lamp.active {
            background: #ff3300;
            box-shadow: 0 0 15px #ff3300;
            color: white; transform: scale(1.1);
            border: 1px solid #fff;
        }

        /* --- 底部洞口指示 --- */
        .holes-container {
            width: 410px;
            display: flex;
            background: #111;
            border-radius: 0 0 10px 10px;
            border: 5px solid #5a3e2b;
            border-top: 2px solid #884400;
            box-sizing: border-box;
            height: 40px;
        }

        .holes-indicator {
            display: flex; 
            width: 350px; 
            margin: 0; padding: 0;
        }
        
        .hole-lamp {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px; 
            color: #555;
            border-right: 1px solid #333;
        }
        .hole-lamp:last-child { border-right: none; }

        .hole-lamp.target {
            color: #ff3300; font-weight: bold; text-shadow: 0 0 8px red; background: rgba(255,0,0,0.1);
        }
        
        .hole-lamp.bonus-active {
            color: #FFD700; font-weight: bold; text-shadow: 0 0 10px gold; background: rgba(255, 215, 0, 0.2);
        }
        
        .pipe-base {
            width: 50px;
            background: #1a1a1a;
            border-left: 2px solid #444;
            box-sizing: border-box;
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; color: #444;
        }

        /* --- 控制区域 --- */
        .controls {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }
        
        .game-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr 2.5fr;
            gap: 10px;
        }

        button {
            padding: 12px; border: none; border-radius: 8px;
            font-weight: bold; font-size: 14px; cursor: pointer;
            transition: all 0.1s;
        }
        button:active { transform: scale(0.96); filter: brightness(0.9); }
        button:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(100%); animation: none; }

        .btn-bet { background: #ffc107; color: #222; }
        
        .btn-allin { 
            background: #dc3545; 
            color: white; 
            box-shadow: 0 0 10px rgba(220, 53, 69, 0.5);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(220, 53, 69, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0); }
        }

        .btn-start { background: #0d6efd; color: white; font-size: 16px; }
        
        .shop-area { margin-top: 10px; width: 100%; display: flex; flex-direction: column; gap: 8px;}
        .btn-shop { 
            background: linear-gradient(45deg, #6a11cb 0%, #2575fc 100%); 
            color: white; width: 100%; font-size: 16px;
            border: 1px solid #aaa;
            box-shadow: 0 4px 15px rgba(37, 117, 252, 0.4);
        }
        
        /* 新增：排行榜按钮样式 */
        .btn-rank {
            background: linear-gradient(45deg, #FF8008 0%, #FFC837 100%);
            color: #222; width: 100%; font-size: 16px;
            border: 1px solid #fff;
            box-shadow: 0 4px 15px rgba(255, 200, 55, 0.4);
        }

        .launch-area {
            display: flex; flex-direction: column; align-items: center;
            background: #222; padding: 10px; border-radius: 8px; border: 1px dashed #555;
        }
        #power-bar-container {
            width: 100%; height: 15px; background: #444;
            margin-bottom: 8px; border-radius: 10px; overflow: hidden;
        }
        #power-bar {
            width: 0%; height: 100%;
            background: linear-gradient(90deg, #0f0, #ff0, #f00);
        }
        #btn-launch {
            background: #ff4500; color: white; width: 100%; font-size: 18px; letter-spacing: 2px;
        }

        #message {
            margin-top: 10px; color: #ddd; height: 20px; font-size: 14px; text-align: center;
        }

        /* --- 弹窗通用样式 --- */
        #shop-modal, #login-modal, #leaderboard-modal {
            display: none;
            position: fixed; z-index: 100; left: 0; top: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.85);
            align-items: center; justify-content: center;

        .modal-content, .shop-content {

            border-radius: 15px; padding: 25px;
            width: 400px; max-width: 95%;

            position: relative;
            box-shadow: 0 0 40px rgba(0, 204, 255, 0.3);

        .shop-content { width: 600px; max-height: 90vh; overflow-y: auto; }

        .close-btn {
            position: absolute; top: 10px; right: 15px;
            font-size: 28px; cursor: pointer; color: #aaa;

        /* --- 登录框样式 --- */
        .login-input {
            width: 80%; padding: 12px; margin: 8px 0;

            border-radius: 8px; font-size: 16px; text-align: center; outline: none;

        /* --- 排行榜表格 --- */

<script>
    // --- 音效管理器 ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = new AudioContext();

    function tryResumeAudio() { if (audioCtx.state === 'suspended') audioCtx.resume(); }

    const soundEffects = {
        click: () => {
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.frequency.setValueAtTime(600, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        },
        pegHit: () => {
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            const freq = 800 + Math.random() * 400; osc.type = 'triangle';

        pegs = [];

        const marginLarge = (playAreaWidth - (topRow1Cols-1)*spacingLarge) / 2;
        for (let c=0; c<topRow1Cols; c++) pegs.push({ x: marginLarge + c * spacingLarge, y: topRow1Y, radius: 12, type: 'large', flashVal: 0 });
        
        const topRow2Y = 130; const topRow2Cols = 5;
        const marginLarge2 = (playAreaWidth - (topRow2Cols-1)*spacingLarge) / 2;
        for (let c=0; c<topRow2Cols; c++) pegs.push({ x: marginLarge2 + c * spacingLarge, y: topRow2Y, radius: 12, type: 'large', flashVal: 0 });

        const rows = 8; const startY = 180; const spacingX = 40; const spacingY = 35;
        for (let row = 0; row < rows; row++) {
            const rowIsEven = row % 2 === 0; const cols = rowIsEven ? 8 : 7; 
            const rowWidth = (cols - 1) * spacingX; const marginLeft = (playAreaWidth - rowWidth) / 2;
            for (let col = 0; col < cols; col++) {
                let jitter = (Math.random() - 0.5) * 4; 
                pegs.push({ x: marginLeft + col * spacingX + jitter, y: startY + row * spacingY, radius: 5, type: 'normal', flashVal: 0 });
            }
        }
    }

        } return selected;

    function gameLoop() {
        ctx.clearRect(0, 0, width, height); 
        drawBoard(); updateParticles();
        if (ball.active) {
            if (ball.inChannel) updateLaunchPhysics(); else updatePlayPhysics();
            drawBall();

    function updateParticles() {
        for(let i=particles.length-1; i>=0; i--) {
            let p = particles[i];
            p.x += p.vx; p.y += p.vy; p.vy += 0.1; p.life -= 0.02;
            ctx.fillStyle = p.color; ctx.globalAlpha = p.life;
            ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI*2); ctx.fill();
            ctx.globalAlpha = 1.0; if(p.life <= 0) particles.splice(i, 1);
        }
    }

    function updateLaunchPhysics() {
        ball.vy += gravity; ball.x += ball.vx; ball.y += ball.vy;
        const pipeInnerLeft = pipeWallX + 5; const pipeInnerRight = width - 5; const guideZoneY = 120;
        if (ball.y < guideZoneY) {
            if (ball.x > pipeWallX) {
                if (ball.vy < 0) { ball.vx -= 1.5; ball.vy *= 0.6; } else { ball.vx -= 0.5; }
                const roofHeight = (ball.x - pipeWallX) * 2.0; 
                if (ball.y < roofHeight + ballRadius) {
                    ball.y = roofHeight + ballRadius; ball.vy = Math.abs(ball.vy) * 0.5; ball.vx -= 2.0; 
                }
            }
        } else {
            if (ball.x < pipeInnerLeft + ballRadius) { ball.x = pipeInnerLeft + ballRadius; ball.vx *= -0.5; }
            if (ball.x > pipeInnerRight - ballRadius) { ball.x = pipeInnerRight - ballRadius; ball.vx *= -0.5; }
        }
        if (ball.x < pipeWallX) { ball.inChannel = false; ball.vx += (Math.random() - 0.5) * 1.5; }
        if (ball.y > height - ballRadius && ball.inChannel) {
             ball.active = false; gameState = 'READY_TO_LAUNCH'; cancelCharge(); updateUI(); setMessage("力度太小！请重新发射。");
        }
    }

    function updatePlayPhysics() {
        const dist = Math.sqrt((ball.x - ball.monitorX)**2 + (ball.y - ball.monitorY)**2);
        if (dist < 5) ball.stuckTimer++; else { ball.stuckTimer = 0; ball.monitorX = ball.x; ball.monitorY = ball.y; }
        if (ball.stuckTimer > 300) { ball.ghostTimer = 60; ball.stuckTimer = 0; setMessage("检测到卡球，启动幽灵模式！"); }
        if (ball.ghostTimer > 0) ball.ghostTimer--;

        ball.vy += gravity; ball.x += ball.vx; ball.y += ball.vy;
        if (ball.x > pipeWallX - ballRadius) { ball.x = pipeWallX - ballRadius; ball.vx *= -wallBounciness; if (Math.abs(ball.vx) < 0.5) ball.vx = -1; }
        if (ball.x < ballRadius) { ball.x = ballRadius; ball.vx *= -wallBounciness; if (Math.abs(ball.vx) < 0.5) ball.vx = 1; }
        
        if (ball.y > height - 50) {
            for (let i = 1; i < totalHoles; i++) {
                const lineX = i * holeWidth;
                if (lineX >= pipeWallX) continue;
                if (Math.abs(ball.x - lineX) < ballRadius + 2) {
                     ball.vx *= -0.6; 
                     if (ball.x < lineX) ball.x = lineX - ballRadius - 2; else ball.x = lineX + ballRadius + 2;
                }
            }
        }
        if (ball.ghostTimer <= 0) {
            pegs.forEach(peg => {
                const pdx = ball.x - peg.x; const pdy = ball.y - peg.y; 
                const pdist = Math.sqrt(pdx*pdx + pdy*pdy); const combinedRadius = ballRadius + peg.radius;
                if (pdist < combinedRadius) {
                    const nx = pdx/pdist; const ny = pdy/pdist;
                    ball.x += nx*(combinedRadius - pdist); ball.y += ny*(combinedRadius - pdist);
                    const dot = ball.vx*nx + ball.vy*ny;
                    ball.vx = (ball.vx - 2*dot*nx)*0.7 + (Math.random()-0.5) * 0.5; ball.vy = (ball.vy - 2*dot*ny)*0.7;
                    peg.flashVal = 1.0; soundEffects.pegHit(); 
                }
            });
        }
        if (ball.y > height - ballRadius) finishRound();
    }

    function drawBoard() {
        if (isBonusRound && gameState !== 'IDLE') {
             const alpha = 0.1 + Math.sin(Date.now() / 200) * 0.05;
             ctx.fillStyle = `rgba(255, 215, 0, ${alpha})`; ctx.fillRect(0, 0, playAreaWidth, height);
             ctx.font = "bold 40px Arial"; ctx.fillStyle = `rgba(255, 255, 255, 0.1)`; ctx.textAlign = "center"; ctx.fillText("BONUS", playAreaWidth/2, height/2);
        }
        ctx.save(); ctx.strokeStyle = '#5a3e2b'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(0, 20); ctx.quadraticCurveTo(0, 0, 20, 0); ctx.lineTo(width - 20, 0); ctx.quadraticCurveTo(width, 0, width, 20); ctx.lineTo(width, height); ctx.lineTo(0, height); ctx.closePath(); ctx.stroke(); ctx.restore();

        ctx.save();
        ctx.fillStyle = '#333'; ctx.fillRect(width - 5, 100, 5, height - 100);
        ctx.fillStyle = '#555'; ctx.fillRect(pipeWallX, 100, 5, height - 100);
        ctx.beginPath(); ctx.moveTo(pipeWallX, 100); ctx.lineTo(pipeWallX, 0); ctx.lineTo(width, 0); ctx.lineTo(width, 100);
        ctx.quadraticCurveTo(pipeWallX, 100, pipeWallX, 0); ctx.closePath();
        ctx.fillStyle = '#444'; ctx.fill(); ctx.strokeStyle = '#666'; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = 'rgba(255, 255, 255, 0.02)'; ctx.fillRect(pipeWallX, 0, pipeWidth, height); ctx.restore();

        pegs.forEach(peg => {
            if (peg.flashVal > 0) peg.flashVal -= 0.1; const isHit = peg.flashVal > 0.5;
            ctx.beginPath(); ctx.arc(peg.x, peg.y, peg.radius, 0, Math.PI*2);
            const grad = ctx.createRadialGradient(peg.x - 2, peg.y - 2, 1, peg.x, peg.y, peg.radius);
            if (isHit) { grad.addColorStop(0, '#ffaaaa'); grad.addColorStop(1, '#ff0000'); } 
            else { if (peg.type === 'large') { grad.addColorStop(0, '#ffffff'); grad.addColorStop(0.3, '#d0d0d0'); grad.addColorStop(1, '#888888'); } else { grad.addColorStop(0, '#ffeb3b'); grad.addColorStop(0.3, '#fbc02d'); grad.addColorStop(1, '#f57f17'); } }
            ctx.fillStyle = grad; ctx.fill();
        });

        ctx.strokeStyle = '#884400'; ctx.lineWidth = 2;
        for (let i = 1; i < totalHoles; i++) {
            const x = i * holeWidth;
            if (x < pipeWallX) { 
                ctx.beginPath(); ctx.moveTo(x, height-50); ctx.lineTo(x, height); ctx.stroke(); 
                ctx.fillStyle = '#5a3e2b'; ctx.fillRect(x-1, height-50, 2, 50);
            }
        }
        
        if (isBonusRound && targetHoles.length > 0) {
            ctx.fillStyle = 'rgba(255, 215, 0, 0.3)'; targetHoles.forEach(h => { ctx.fillRect(h * holeWidth + 1, height - 50, holeWidth - 2, 50); });
        } else {
            ctx.fillStyle = 'rgba(255, 50, 0, 0.2)'; targetHoles.forEach(h => { ctx.fillRect(h * holeWidth + 1, height - 50, holeWidth - 2, 50); });
        }
    }

    function drawBall() {
        ctx.save(); if (ball.ghostTimer > 0) ctx.globalAlpha = 0.4;
        ctx.beginPath(); ctx.arc(ball.x, ball.y, ballRadius, 0, Math.PI*2); 
        const grad = ctx.createRadialGradient(ball.x-2, ball.y-2, 2, ball.x, ball.y, ballRadius);
        grad.addColorStop(0, 'white'); grad.addColorStop(1, 'silver');
        ctx.fillStyle = grad; ctx.fill(); ctx.strokeStyle = '#444'; ctx.lineWidth = 1; ctx.stroke(); ctx.restore();
    }

    function finishRound() {
        ball.active = false; if (ball.x > pipeWallX) { resetGame(); return; }
        const landedHole = Math.max(0, Math.min(totalHoles - 1, Math.floor(ball.x / holeWidth)));
        if (targetHoles.includes(landedHole)) {
            const winAmount = currentBet * currentMultiplier; beads += winAmount; wonThisRound = winAmount;
            const pointsWon = Math.floor(winAmount / 50);
            if (isBonusRound) { soundEffects.bonusWin(); setMessage(`🌟 BONUS WIN! 赢得 ${winAmount} 弹珠！`); points += (pointsWon * 2); } 
            else { soundEffects.win(); if (pointsWon > 0) points += pointsWon; setMessage(`🎉 恭喜！落入 ${landedHole+1}号洞，赢得 ${winAmount} 弹珠！`); }
            clearLights(); if (isBonusRound) { for(let i=0; i<totalHoles; i++) highlightHole(i, true); } else { highlightHole(landedHole, false); }
            highlightMultiplier(currentMultiplier);
        } else { soundEffects.lose(); setMessage(`遗憾！落入 ${landedHole+1}号洞，未命中目标。`); }
        checkGameOver(); setTimeout(resetGame, 2000); updateUI();
    }
    
    function resetGame() { if (beads > 0) { gameState = 'IDLE'; targetHoles = []; clearLights(); isBonusRound = false; if (beads >= 5) currentBet = 5; else currentBet = beads; updateUI(); } }
    
    function checkGameOver() { 
        if (beads <= 0) { 
            gameState = 'GAME_OVER'; setMessage("GAME OVER！请充值！"); currentBet = 0; 
            // 游戏结束，上传分数
            soundEffects.lose();
            uploadScore(); 
            setTimeout(() => openLeaderboard(), 1500); 
        } 
    }
    
    function clearLights() { document.querySelectorAll('.lamp').forEach(el => el.classList.remove('active')); document.querySelectorAll('.hole-lamp').forEach(el => {el.classList.remove('target'); el.classList.remove('bonus-active');}); }
    function highlightMultiplier(m) { document.getElementById(`mult-lamp-${m}`)?.classList.add('active'); }
    function highlightHole(h, isBonus) { const el = document.getElementById(`hole-lamp-${h}`); if(el) { if(isBonus) el.classList.add('bonus-active'); else el.classList.add('target'); } }
    
    function updateUI() {
        document.getElementById('bead-display').innerText = beads; document.getElementById('bet-display').innerText = currentBet;
        document.getElementById('won-display').innerText = wonThisRound; document.getElementById('points-display').innerText = points; document.getElementById('shop-points').innerText = points;
        const isIdle = gameState === 'IDLE';
        document.getElementById('btn-start').disabled = !isIdle || beads <= 0 || currentBet <= 0;
        document.getElementById('btn-bet').disabled = !isIdle || beads <= 0;
        const allInBtn = document.getElementById('btn-allin'); if (allInBtn) allInBtn.disabled = !isIdle || beads <= 0;
        document.getElementById('btn-launch').disabled = gameState !== 'READY_TO_LAUNCH';
    }
    function setMessage(msg) { document.getElementById('message').innerText = msg; }
    function openShop() { tryResumeAudio(); soundEffects.click(); document.getElementById('shop-modal').style.display = 'flex'; updateUI(); }
    function closeShop() { document.getElementById('shop-modal').style.display = 'none'; }
    function buyItem(cost, itemName) {
        soundEffects.click();
        if (points >= cost) { points -= cost; alert(itemName.includes('大便') || itemName.includes('腿毛') ? `💩 口味真重！\n您花费巨资兑换了：[${itemName}]！` : `🎉 恭喜老板！\n您已成功兑换：[${itemName}]！`); updateUI(); }
        else { alert(`积分不足！还需要 ${cost - points} 积分。`); }
    }

    init();
</script>
</body>
</html>

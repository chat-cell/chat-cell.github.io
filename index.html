<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黄力的弹珠碰碰乐 </title>
    <style>
        /* --- 基础样式 --- */
        body {
            background-color: #1a1a1a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            user-select: none;
            min-height: 100vh;
        }

        h1 { margin-bottom: 10px; text-shadow: 0 0 10px #ff00de; color: #ff00de; font-style: italic; }

        /* --- 游戏机主体 --- */
        #game-cabinet {
            background: #2a2a2a;
            border: 10px solid #444;
            border-radius: 30px;
            padding: 20px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 440px; 
            position: relative;
        }

        /* --- 顶部状态栏 --- */
        .display-panel {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 5px;
            width: 100%;
            margin-bottom: 15px;
            background: #000;
            padding: 10px;
            border-radius: 12px;
            border: 2px solid #666;
            box-sizing: border-box;
        }
        .stat-box { text-align: center; }
        .stat-label { font-size: 11px; color: #aaa; margin-bottom: 2px; }
        .stat-value { font-size: 16px; font-weight: bold; font-family: 'Courier New', monospace; }
        .stat-value.highlight { color: #ffcc00; }
        .stat-value.points { color: #00ccff; }

        /* --- 画布与灯光 --- */
        canvas {
            background: radial-gradient(circle at 40% 30%, #2b2b48 0%, #000000 100%);
            border: 5px solid #5a3e2b;
            border-bottom: none;
            border-radius: 20px 20px 0 0;
            box-shadow: inset 0 0 30px #000;
            cursor: pointer;
            display: block;
            width: 400px; 
            height: 500px;
        }

        .lights-panel {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 10px;
            padding: 5px;
            background: #111;
            border-radius: 4px;
            box-sizing: border-box;
        }
        
        .lamp {
            width: 30px; height: 30px;
            border-radius: 50%;
            background: #333;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: bold; color: #555;
            box-shadow: inset 0 0 5px #000;
            transition: all 0.1s;
        }
        .lamp.active {
            background: #ff3300;
            box-shadow: 0 0 15px #ff3300;
            color: white; transform: scale(1.1);
            border: 1px solid #fff;
        }

        /* --- 底部洞口指示 --- */
        .holes-container {
            width: 410px;
            display: flex;
            background: #111;
            border-radius: 0 0 10px 10px;
            border: 5px solid #5a3e2b;
            border-top: 2px solid #884400;
            box-sizing: border-box;
            height: 40px;
        }

        .holes-indicator {
            display: flex; 
            width: 350px; 
            margin: 0; padding: 0;
        }
        
        .hole-lamp {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px; 
            color: #555;
            border-right: 1px solid #333;
        }
        .hole-lamp:last-child { border-right: none; }

        .hole-lamp.target {
            color: #ff3300; font-weight: bold; text-shadow: 0 0 8px red; background: rgba(255,0,0,0.1);
        }
        
        .hole-lamp.bonus-active {
            color: #FFD700; font-weight: bold; text-shadow: 0 0 10px gold; background: rgba(255, 215, 0, 0.2);
        }
        
        .pipe-base {
            width: 50px;
            background: #1a1a1a;
            border-left: 2px solid #444;
            box-sizing: border-box;
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; color: #444;
        }

        /* --- 控制区域 --- */
        .controls {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }
        
        .game-buttons {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 10px;
        }

        button {
            padding: 12px; border: none; border-radius: 8px;
            font-weight: bold; font-size: 14px; cursor: pointer;
            transition: all 0.1s;
        }
        button:active { transform: scale(0.96); filter: brightness(0.9); }
        button:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(100%); }

        .btn-bet { background: #ffc107; color: #222; }
        .btn-start { background: #0d6efd; color: white; font-size: 16px; }
        
        .shop-area { margin-top: 15px; width: 100%; }
        .btn-shop { 
            background: linear-gradient(45deg, #6a11cb 0%, #2575fc 100%); 
            color: white; width: 100%; font-size: 16px;
            border: 1px solid #aaa;
            box-shadow: 0 4px 15px rgba(37, 117, 252, 0.4);
        }

        .launch-area {
            display: flex; flex-direction: column; align-items: center;
            background: #222; padding: 10px; border-radius: 8px; border: 1px dashed #555;
        }
        #power-bar-container {
            width: 100%; height: 15px; background: #444;
            margin-bottom: 8px; border-radius: 10px; overflow: hidden;
        }
        #power-bar {
            width: 0%; height: 100%;
            background: linear-gradient(90deg, #0f0, #ff0, #f00);
        }
        #btn-launch {
            background: #ff4500; color: white; width: 100%; font-size: 18px; letter-spacing: 2px;
        }

        #message {
            margin-top: 10px; color: #ddd; height: 20px; font-size: 14px; text-align: center;
        }

        /* --- 神秘商店 Modal --- */
        #shop-modal {
            display: none;
            position: fixed; z-index: 100; left: 0; top: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.85);
            align-items: center; justify-content: center;
            backdrop-filter: blur(5px);
        }
        .shop-content {
            background: #222;
            border: 2px solid #00ccff;
            border-radius: 15px; padding: 25px;
            width: 600px; max-width: 95%;
            max-height: 90vh; overflow-y: auto;
            box-shadow: 0 0 40px rgba(0, 204, 255, 0.3);
            text-align: center;
            position: relative;
        }
        .shop-close {
            position: absolute; top: 10px; right: 15px;
            font-size: 28px; cursor: pointer; color: #aaa;
        }
        .shop-close:hover { color: #fff; }
        
        .shop-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px; margin-top: 20px;
        }
        .shop-item {
            background: rgba(255,255,255,0.05);
            padding: 10px; border-radius: 12px;
            border: 1px solid #444;
            display: flex; flex-direction: column; align-items: center;
            transition: transform 0.2s;
        }
        .shop-item:hover { border-color: #00ccff; transform: translateY(-3px); }
        
        .icon-box {
            width: 60px; height: 60px;
            margin-bottom: 8px;
            display: flex; align-items: center; justify-content: center;
        }
        
        .shop-item-name { font-size: 13px; font-weight: bold; margin-bottom: 5px; color: #fff; }
        .shop-item-cost { color: #00ccff; font-size: 12px; margin-bottom: 8px; }
        .btn-buy {
            background: #00ccff; border: none;
            color: #000; padding: 5px 12px; font-weight:bold; font-size: 12px; width: auto;
            border-radius: 20px;
        }
        .btn-buy:hover { background: #fff; }

    </style>
</head>

<script>
    // --- 音效管理器 ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = new AudioContext();

    function tryResumeAudio() { if (audioCtx.state === 'suspended') audioCtx.resume(); }

    const soundEffects = {
        click: () => {
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.frequency.setValueAtTime(600, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        },
        pegHit: () => {
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            const freq = 800 + Math.random() * 400; osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.15);
        },
        spin: () => {
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = 'square'; osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.05);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.05);
        },
        win: () => {
            [523.25, 659.25, 783.99].forEach((freq, i) => {
                setTimeout(() => {
                    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                    osc.type = 'sine'; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
                    osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.5);
                }, i * 100);
            });
        },
        bonusWin: () => {
            [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                setTimeout(() => {
                    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);
                    osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.8);
                }, i * 80);
            });
        },
        lose: () => {
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime); osc.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.4);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.4);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.4);
        },
        charge: (powerPercent) => {
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.frequency.setValueAtTime(200 + powerPercent * 5, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.05);
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.05);
        },
        explode: () => {
             const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
             osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, audioCtx.currentTime);
             osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.5);
             gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5);
             osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        }
    };

    // --- 游戏参数 ---
    let beads = 200;
    let currentBet = 5;
    let wonThisRound = 0;
    let points = 0;
    let currentMultiplier = 0;
    let targetHoles = [];
    let gameState = 'IDLE'; 
    let roundsPlayed = 0;
    let isBonusRound = false;

    // 彩蛋与特效
    let easterEggClicks = 0;
    let particles = [];

    const multiplierMap = { 2: 6, 4: 5, 6: 4, 8: 3, 10: 1 };
    const multipliers = Object.keys(multiplierMap).map(Number);
    const totalHoles = 10;
    
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const width = canvas.width;   
    const height = canvas.height; 
    
    // --- 管道与区域设置 ---
    const pipeWidth = 50;
    const playAreaWidth = 350; 
    const pipeWallX = playAreaWidth; 
    
    const holeWidth = playAreaWidth / totalHoles; 
    
    // 物理参数
    const ballRadius = 12;
    const gravity = 0.25;
    const wallBounciness = 0.6;
    
    let ball = { 
        x: 0, y: 0, vx: 0, vy: 0, 
        active: false, 
        inChannel: true,
        // 防卡死新变量
        monitorX: 0, 
        monitorY: 0,
        stuckTimer: 0,    // 累积卡住的帧数
        ghostTimer: 0     // 幽灵模式倒计时
    };
    
    let pegs = [];

    // --- 初始化 ---
    function init() {
        createPegs(); createLights(); createHoleIndicators(); updateUI(); 
        
        canvas.addEventListener('mousedown', handleCanvasClick);
        
        requestAnimationFrame(gameLoop);
    }

    function createPegs() {
        pegs = [];
        const topRow1Y = 90;
        const topRow1Cols = 6;
        const spacingLarge = 58; 
        const marginLarge = (playAreaWidth - (topRow1Cols-1)*spacingLarge) / 2;
        
        for (let c=0; c<topRow1Cols; c++) {
             pegs.push({ x: marginLarge + c * spacingLarge, y: topRow1Y, radius: 12, type: 'large', flashVal: 0 });
        }
        
        const topRow2Y = 130;
        const topRow2Cols = 5;
        const marginLarge2 = (playAreaWidth - (topRow2Cols-1)*spacingLarge) / 2;
        for (let c=0; c<topRow2Cols; c++) {
             pegs.push({ x: marginLarge2 + c * spacingLarge, y: topRow2Y, radius: 12, type: 'large', flashVal: 0 });
        }

        const rows = 8; const startY = 180; const spacingX = 40; const spacingY = 35;
        for (let row = 0; row < rows; row++) {
            const rowIsEven = row % 2 === 0; const cols = rowIsEven ? 8 : 7; 
            const rowWidth = (cols - 1) * spacingX; const marginLeft = (playAreaWidth - rowWidth) / 2;
            for (let col = 0; col < cols; col++) {
                let jitter = (Math.random() - 0.5) * 4; 
                pegs.push({ x: marginLeft + col * spacingX + jitter, y: startY + row * spacingY, radius: 5, type: 'normal', flashVal: 0 });
            }
        }
    }

    function createLights() {
        const container = document.getElementById('multiplier-lights'); container.innerHTML = '';
        multipliers.forEach(m => {
            const div = document.createElement('div'); div.className = 'lamp'; div.id = `mult-lamp-${m}`; div.innerText = `x${m}`; container.appendChild(div);
        });
    }

    function createHoleIndicators() {
        const container = document.getElementById('hole-indicators'); container.innerHTML = '';
        for(let i=0; i<totalHoles; i++) {
            const div = document.createElement('div'); div.className = 'hole-lamp'; div.id = `hole-lamp-${i}`; div.innerText = (i+1); container.appendChild(div);
        }
    }
    
    // --- 彩蛋逻辑 ---
    function handleCanvasClick(e) {
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        
        if(pegs.length > 0) {
            const p = pegs[0];
            const dist = Math.sqrt((mouseX - p.x)**2 + (mouseY - p.y)**2);
            if(dist < p.radius + 10) {
                easterEggClicks++;
                soundEffects.click();
                if(easterEggClicks >= 5) {
                    triggerEasterEgg();
                    easterEggClicks = 0;
                }
            } else {
                easterEggClicks = 0; 
            }
        }
    }

    function triggerEasterEgg() {
        beads += 1000;
        updateUI();
        setMessage("🎉 恭喜触发黄力为你亲手埋下的彩蛋！获得1000弹珠！ 🎉");
        soundEffects.bonusWin();
        soundEffects.explode();
        
        for(let i=0; i<100; i++) {
            particles.push({
                x: width/2, y: height/3,
                vx: (Math.random() - 0.5) * 10,
                vy: (Math.random() - 0.5) * 10,
                life: 1.0,
                color: `hsl(${Math.random()*360}, 100%, 50%)`
            });
        }
    }

    // --- 交互逻辑 ---
    function increaseBet() {
        tryResumeAudio(); soundEffects.click();
        if (gameState !== 'IDLE') return;
        if (beads >= currentBet + 5) currentBet += 5; else { currentBet = beads; setMessage("已达到最大可下注额！"); }
        updateUI();
    }

    function startGame() {
        tryResumeAudio(); soundEffects.click();
        if (beads < currentBet || beads <= 0) { setMessage("弹珠不足！请联系黄老板充值。"); checkGameOver(); return; }
        
        roundsPlayed++; isBonusRound = (roundsPlayed % 10 === 0);
        beads -= currentBet; wonThisRound = 0; gameState = 'SPINNING'; updateUI(); 
        setMessage(isBonusRound ? "🌟 黄金时刻！随便进洞都中奖！🌟" : "抽奖中...");
        
        let spinCount = 0;
        const spinInterval = setInterval(() => {
            clearLights(); soundEffects.spin();
            const randMult = multipliers[Math.floor(Math.random() * multipliers.length)];
            highlightMultiplier(randMult);
            if (isBonusRound) { for(let i=0; i<totalHoles; i++) highlightHole(i, true); }
            else {
                const numToLight = multiplierMap[randMult];
                const randomHoles = getRandomHoles(numToLight);
                randomHoles.forEach(h => highlightHole(h, false));
            }
            spinCount++; if (spinCount > 15) { clearInterval(spinInterval); lockInTarget(); }
        }, 80);
    }

    function lockInTarget() {
        clearLights(); soundEffects.click();
        currentMultiplier = multipliers[Math.floor(Math.random() * multipliers.length)];
        highlightMultiplier(currentMultiplier);
        
        if (isBonusRound) {
            targetHoles = Array.from({length: totalHoles}, (_, i) => i);
            targetHoles.forEach(h => highlightHole(h, true));
            setMessage(`✨ 黄金模式 x${currentMultiplier}！请发射！`);
        } else {
            const numHolesToLight = multiplierMap[currentMultiplier];
            targetHoles = getRandomHoles(numHolesToLight);
            targetHoles.forEach(h => highlightHole(h, false));
            setMessage(`目标锁定 ${currentMultiplier}倍！请蓄力发射！`);
        }
        gameState = 'READY_TO_LAUNCH'; updateUI(); 
    }

    function getRandomHoles(count) {
        const available = Array.from({length: totalHoles}, (_, i) => i); const selected = [];
        for (let i = 0; i < count; i++) {
            const randomIndex = Math.floor(Math.random() * available.length); selected.push(available[randomIndex]); available.splice(randomIndex, 1);
        } return selected;
    }

    // 发射
    let chargePower = 0; let chargeInterval = null;
    function startCharge() {
        if (gameState !== 'READY_TO_LAUNCH') return;
        tryResumeAudio(); chargePower = 0; const bar = document.getElementById('power-bar');
        chargeInterval = setInterval(() => {
            chargePower += 3; if (chargePower > 100) chargePower = 100;
            bar.style.width = chargePower + '%';
            if (chargePower % 10 < 3) soundEffects.charge(chargePower);
        }, 20);
    }
    function cancelCharge() { if (chargeInterval) { clearInterval(chargeInterval); chargeInterval = null; document.getElementById('power-bar').style.width = '0%'; } }
    
    function releaseBall() {
        if (gameState !== 'READY_TO_LAUNCH' || !chargeInterval) return;
        clearInterval(chargeInterval); chargeInterval = null;
        
        soundEffects.click();
        ball.active = true; 
        ball.inChannel = true; 
        
        // 重置防卡死变量
        ball.stuckTimer = 0;
        ball.ghostTimer = 0;
        ball.monitorX = ball.x; ball.monitorY = ball.y;

        ball.x = width - 25;   
        ball.y = height - 50;
        
        let power = 18 + (chargePower / 100) * 27; 
        ball.vy = -power; 
        ball.vx = 0; 
        
        gameState = 'LAUNCHING'; updateUI(); document.getElementById('power-bar').style.width = '0%'; setMessage("弹珠发射！");
    }

    // --- 核心物理引擎 ---
    function gameLoop() {
        ctx.clearRect(0, 0, width, height); 
        drawBoard();
        updateParticles();
        
        if (ball.active) {
            if (ball.inChannel) {
                updateLaunchPhysics();
            } else {
                updatePlayPhysics();
            }
            drawBall();
        }
        requestAnimationFrame(gameLoop);
    }

    function updateParticles() {
        for(let i=particles.length-1; i>=0; i--) {
            let p = particles[i];
            p.x += p.vx; p.y += p.vy; p.vy += 0.1; p.life -= 0.02;
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life;
            ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI*2); ctx.fill();
            ctx.globalAlpha = 1.0;
            if(p.life <= 0) particles.splice(i, 1);
        }
    }

    // 发射阶段物理
// --- 修复后的发射物理引擎 ---
    function updateLaunchPhysics() {
        // 1. 常规重力 (但在导向区内会重写)
        ball.vy += gravity; 
        ball.x += ball.vx; 
        ball.y += ball.vy;

        const pipeInnerLeft = pipeWallX + 5;  // 管道左内壁 (355)
        const pipeInnerRight = width - 5;     // 管道右内壁 (395)
        const guideZoneY = 120;               // 导向区高度阈值

        // 2. 顶部强力导向逻辑 (核心修复)
        // 当球进入顶部 120px 区域时
        if (ball.y < guideZoneY) {
            
            // A. 计算导流曲线限制 (天花板)
            // 我们定义一个圆弧天花板：圆心在 (pipeWallX, guideZoneY)，半径为 guideZoneY
            // 这是一个从右下 (400, 120) 弯向左上 (350, 0) 的弧线
            
            // 计算球心相对于导向圆心的偏移
            const cx = pipeWallX; 
            const cy = guideZoneY;
            const dx = ball.x - cx;
            const dy = ball.y - cy;
            const dist = Math.sqrt(dx*dx + dy*dy);
            
            // 如果球在圆弧内（即碰到了天花板），或者球的速度还在往上冲
            // 这里的 dist < guideZoneY 代表球进入了圆弧的“实体”部分（左上角区域）
            // 为了简化体验，我们直接检测高度和位置
            
            // B. 强制导向力场 (Vector Field)
            // 只要在管道里且高度足够高，就施加向左的强力
            if (ball.x > pipeWallX) {
                // 如果球还在向上运动 (vy < 0)
                if (ball.vy < 0) {
                    // 核心魔法：将向上的速度直接转化为向左的速度
                    // 越接近顶部，转化率越高
                    ball.vx -= 1.5;         // 持续施加向左推力
                    ball.vy *= 0.6;         // 快速衰减垂直速度（防止撞顶太猛）
                } else {
                    // 如果球已经开始下落了，但还在管道里，给它一个推力防止直上直下
                    ball.vx -= 0.5;
                }
                
                // C. 天花板几何限制 (防止穿模)
                // 简单的线性天花板模拟：y = (x - 350) * 2
                // 这是一条斜线，从 (350,0) 到 (400,100)
                const roofHeight = (ball.x - pipeWallX) * 2.0; 
                if (ball.y < roofHeight + ballRadius) {
                    ball.y = roofHeight + ballRadius; // 压回轨道
                    ball.vy = Math.abs(ball.vy) * 0.5; // 稍微向下反弹
                    ball.vx -= 2.0; // 撞墙后获得巨大的向左反作用力
                }
            }
        } else {
            // 3. 管道下半部分（垂直段）的常规碰撞
            if (ball.x < pipeInnerLeft + ballRadius) { 
                ball.x = pipeInnerLeft + ballRadius; 
                ball.vx *= -0.5; 
            }
            if (ball.x > pipeInnerRight - ballRadius) { 
                ball.x = pipeInnerRight - ballRadius; 
                ball.vx *= -0.5; 
            }
        }

        // 4. 单向阀门 (离开管道后禁止返回)
        if (ball.x < pipeWallX) {
            ball.inChannel = false;
            // 出来后给一个随机扰动，增加趣味性
            ball.vx += (Math.random() - 0.5) * 1.5; 
        }
        
        // 5. 发射失败复位 (掉回底部)
        if (ball.y > height - ballRadius && ball.inChannel) {
             ball.active = false;
             gameState = 'READY_TO_LAUNCH';
             cancelCharge(); 
             updateUI(); 
             setMessage("力度太小！请重新发射。");
        }
    }
    // 游戏阶段物理 (主区域)
    function updatePlayPhysics() {
        
        // --- 新增：防卡死监控逻辑 ---
        // 每一帧计算球与上一帧监控点的距离
        const dist = Math.sqrt((ball.x - ball.monitorX)**2 + (ball.y - ball.monitorY)**2);
        
        // 如果距离很小（认为没动），增加计时器
        if (dist < 5) {
            ball.stuckTimer++;
        } else {
            // 如果动了，重置计时器和监控点
            ball.stuckTimer = 0;
            ball.monitorX = ball.x;
            ball.monitorY = ball.y;
        }

        // 如果卡住超过 5 秒 (60帧 * 5 = 300)
        if (ball.stuckTimer > 300) {
            ball.ghostTimer = 60; // 开启 1 秒幽灵模式
            ball.stuckTimer = 0;  // 重置卡死计时
            setMessage("检测到卡球，启动幽灵模式！");
        }

        // 幽灵模式倒计时
        if (ball.ghostTimer > 0) {
            ball.ghostTimer--;
        }

        // --- 物理更新 ---
        ball.vy += gravity; 
        ball.x += ball.vx; 
        ball.y += ball.vy;

        // 右侧墙壁 (实体墙)
        if (ball.x > pipeWallX - ballRadius) {
            ball.x = pipeWallX - ballRadius;
            ball.vx *= -wallBounciness;
            if (Math.abs(ball.vx) < 0.5) ball.vx = -1;
        }

        // 左侧墙壁
        if (ball.x < ballRadius) { 
            ball.x = ballRadius; 
            ball.vx *= -wallBounciness;
            if (Math.abs(ball.vx) < 0.5) ball.vx = 1;
        }
        
        // 底部洞口挡板碰撞
        if (ball.y > height - 50) {
            // 在幽灵模式下，不仅穿钉子，也应该稍微容易进洞，但挡板还是留着防止飞出界
            // 这里我们只在非幽灵模式或者幽灵模式下保留挡板碰撞（防止球掉出世界）
            // 还是保留挡板碰撞比较合理，不然球会穿过挡板不知道去哪了
            for (let i = 1; i < totalHoles; i++) {
                const lineX = i * holeWidth;
                if (lineX >= pipeWallX) continue;
                if (Math.abs(ball.x - lineX) < ballRadius + 2) {
                     ball.vx *= -0.6; 
                     if (ball.x < lineX) ball.x = lineX - ballRadius - 2;
                     else ball.x = lineX + ballRadius + 2;
                }
            }
        }

        // 钉子碰撞 (幽灵模式下跳过此段)
        if (ball.ghostTimer <= 0) {
            pegs.forEach(peg => {
                const pdx = ball.x - peg.x; const pdy = ball.y - peg.y; 
                const pdist = Math.sqrt(pdx*pdx + pdy*pdy); 
                const combinedRadius = ballRadius + peg.radius;
                
                if (pdist < combinedRadius) {
                    const nx = pdx/pdist; const ny = pdy/pdist;
                    ball.x += nx*(combinedRadius - pdist); 
                    ball.y += ny*(combinedRadius - pdist);
                    const dot = ball.vx*nx + ball.vy*ny;
                    ball.vx = (ball.vx - 2*dot*nx)*0.7 + (Math.random()-0.5) * 0.5; 
                    ball.vy = (ball.vy - 2*dot*ny)*0.7;
                    peg.flashVal = 1.0; 
                    soundEffects.pegHit(); 
                }
            });
        }

        if (ball.y > height - ballRadius) finishRound();
    }

function drawBoard() {
        if (isBonusRound && gameState !== 'IDLE') {
             const alpha = 0.1 + Math.sin(Date.now() / 200) * 0.05;
             ctx.fillStyle = `rgba(255, 215, 0, ${alpha})`;
             ctx.fillRect(0, 0, playAreaWidth, height);
             ctx.font = "bold 40px Arial";
             ctx.fillStyle = `rgba(255, 255, 255, 0.1)`;
             ctx.textAlign = "center";
             ctx.fillText("BONUS", playAreaWidth/2, height/2);
        }

        // 1. 绘制游戏机外框
        ctx.save(); ctx.strokeStyle = '#5a3e2b'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(0, 20); ctx.quadraticCurveTo(0, 0, 20, 0); ctx.lineTo(width - 20, 0); ctx.quadraticCurveTo(width, 0, width, 20); ctx.lineTo(width, height); ctx.lineTo(0, height); ctx.closePath(); ctx.stroke(); ctx.restore();

        // 2. 绘制管道结构 (完全重绘)
        ctx.save();
        
        // A. 管道右壁
        ctx.fillStyle = '#333'; ctx.fillRect(width - 5, 100, 5, height - 100);
        
        // B. 管道左壁（隔墙）
        ctx.fillStyle = '#555'; ctx.fillRect(pipeWallX, 100, 5, height - 100);

        // C. 顶部巨大导流块 (视觉核心)
        // 画一个填充的形状，占据右上角，形成一个自然的弯管
        ctx.beginPath();
        ctx.moveTo(pipeWallX, 100);        // 隔墙顶点
        ctx.lineTo(pipeWallX, 0);          // 左上角
        ctx.lineTo(width, 0);              // 右上角
        ctx.lineTo(width, 100);            // 右壁顶点
        // 关键：画一条贝塞尔曲线作为“天花板”
        // 从右壁(400, 100) 弯曲到 左壁(350, 0)
        // 控制点在 (350, 100)，形成内凹的弧面
        ctx.quadraticCurveTo(pipeWallX, 100, pipeWallX, 0);
        ctx.closePath();
        
        // 填充导流块
        ctx.fillStyle = '#444'; 
        ctx.fill();
        ctx.strokeStyle = '#666'; 
        ctx.lineWidth = 2; 
        ctx.stroke();

        // D. 管道背景（半透明）
        ctx.fillStyle = 'rgba(255, 255, 255, 0.02)';
        ctx.fillRect(pipeWallX, 0, pipeWidth, height);
        ctx.restore();

        // 3. 钉子渲染 (保持不变)
        pegs.forEach(peg => {
            if (peg.flashVal > 0) peg.flashVal -= 0.1;
            const isHit = peg.flashVal > 0.5;
            ctx.beginPath(); ctx.arc(peg.x, peg.y, peg.radius, 0, Math.PI*2);
            
            const grad = ctx.createRadialGradient(peg.x - 2, peg.y - 2, 1, peg.x, peg.y, peg.radius);
            if (isHit) { grad.addColorStop(0, '#ffaaaa'); grad.addColorStop(1, '#ff0000'); } 
            else { 
                if (peg.type === 'large') { grad.addColorStop(0, '#ffffff'); grad.addColorStop(0.3, '#d0d0d0'); grad.addColorStop(1, '#888888'); } 
                else { grad.addColorStop(0, '#ffeb3b'); grad.addColorStop(0.3, '#fbc02d'); grad.addColorStop(1, '#f57f17'); }
            }
            ctx.fillStyle = grad; ctx.fill();
        });

        // 4. 洞口分割线 (保持不变)
        ctx.strokeStyle = '#884400'; ctx.lineWidth = 2;
        for (let i = 1; i < totalHoles; i++) {
            const x = i * holeWidth;
            if (x < pipeWallX) { 
                ctx.beginPath(); ctx.moveTo(x, height-50); ctx.lineTo(x, height); ctx.stroke(); 
                ctx.fillStyle = '#5a3e2b';
                ctx.fillRect(x-1, height-50, 2, 50);
            }
        }
        
        // 目标高亮区域 (保持不变)
        if (isBonusRound && targetHoles.length > 0) {
            ctx.fillStyle = 'rgba(255, 215, 0, 0.3)';
            targetHoles.forEach(h => { ctx.fillRect(h * holeWidth + 1, height - 50, holeWidth - 2, 50); });
        } else {
            ctx.fillStyle = 'rgba(255, 50, 0, 0.2)';
            targetHoles.forEach(h => { ctx.fillRect(h * holeWidth + 1, height - 50, holeWidth - 2, 50); });
        }
    }

    function drawBall() {
        ctx.save();
        // 幽灵模式下半透明
        if (ball.ghostTimer > 0) {
            ctx.globalAlpha = 0.4;
        }
        
        ctx.beginPath(); ctx.arc(ball.x, ball.y, ballRadius, 0, Math.PI*2); 
        const grad = ctx.createRadialGradient(ball.x-2, ball.y-2, 2, ball.x, ball.y, ballRadius);
        grad.addColorStop(0, 'white'); grad.addColorStop(1, 'silver');
        ctx.fillStyle = grad; ctx.fill(); ctx.strokeStyle = '#444'; ctx.lineWidth = 1; ctx.stroke();
        
        ctx.restore();
    }

    // --- 结算与辅助 ---
    function finishRound() {
        ball.active = false;
        if (ball.x > pipeWallX) { resetGame(); return; }

        const landedHole = Math.max(0, Math.min(totalHoles - 1, Math.floor(ball.x / holeWidth)));

        if (targetHoles.includes(landedHole)) {
            const winAmount = currentBet * currentMultiplier; 
            beads += winAmount; 
            wonThisRound = winAmount;
            const pointsWon = Math.floor(winAmount / 50);
            
            if (isBonusRound) {
                soundEffects.bonusWin(); setMessage(`🌟 BONUS WIN! 赢得 ${winAmount} 弹珠！`);
                points += (pointsWon * 2); 
            } else {
                soundEffects.win(); if (pointsWon > 0) points += pointsWon;
                setMessage(`🎉 恭喜！落入 ${landedHole+1}号洞，赢得 ${winAmount} 弹珠！`);
            }
            
            clearLights(); 
            if (isBonusRound) { for(let i=0; i<totalHoles; i++) highlightHole(i, true); } else { highlightHole(landedHole, false); }
            highlightMultiplier(currentMultiplier);
        } else {
            soundEffects.lose(); setMessage(`遗憾！落入 ${landedHole+1}号洞，未命中目标。`);
        }
        checkGameOver(); setTimeout(resetGame, 2000); updateUI();
    }
    
    function resetGame() {
        if (beads > 0) { gameState = 'IDLE'; targetHoles = []; clearLights(); isBonusRound = false; if (beads >= 5) currentBet = 5; else currentBet = beads; updateUI(); }
    }
    function checkGameOver() { if (beads <= 0) { gameState = 'GAME_OVER'; setMessage("GAME OVER！请充值！"); currentBet = 0; } }
    
    function clearLights() { document.querySelectorAll('.lamp').forEach(el => el.classList.remove('active')); document.querySelectorAll('.hole-lamp').forEach(el => {el.classList.remove('target'); el.classList.remove('bonus-active');}); }
    
    function highlightMultiplier(m) { document.getElementById(`mult-lamp-${m}`)?.classList.add('active'); }
    
    function highlightHole(h, isBonus) { 
        const el = document.getElementById(`hole-lamp-${h}`);
        if(el) { if(isBonus) el.classList.add('bonus-active'); else el.classList.add('target'); }
    }
    
    function updateUI() {
        document.getElementById('bead-display').innerText = beads; document.getElementById('bet-display').innerText = currentBet;
        document.getElementById('won-display').innerText = wonThisRound; document.getElementById('points-display').innerText = points; document.getElementById('shop-points').innerText = points;
        const isIdle = gameState === 'IDLE';
        document.getElementById('btn-start').disabled = !isIdle || beads <= 0 || currentBet <= 0;
        document.getElementById('btn-bet').disabled = !isIdle || beads <= 0;
        document.getElementById('btn-launch').disabled = gameState !== 'READY_TO_LAUNCH';
    }
    function setMessage(msg) { document.getElementById('message').innerText = msg; }
    function openShop() { tryResumeAudio(); soundEffects.click(); document.getElementById('shop-modal').style.display = 'flex'; updateUI(); }
    function closeShop() { document.getElementById('shop-modal').style.display = 'none'; }
    function buyItem(cost, itemName) {
        soundEffects.click();
        if (points >= cost) { points -= cost; alert(itemName.includes('大便') ? `💩 真的吗？\n您花费巨资兑换了：[${itemName}]！` : `🎉 恭喜老板！\n您已成功兑换：[${itemName}]！`); updateUI(); }
        else { alert(`积分不足！还需要 ${cost - points} 积分。`); }
    }

    init();
</script>
